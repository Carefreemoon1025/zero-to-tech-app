<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>液态玻璃折射 · 最小复现台</title>
<style>
  /* 用来定位"折射到底哪一步断掉"的对照实验台。
     五块玻璃横向完全对齐、纵向堆叠：竖条纹相位只跟 x 有关，
     所以它们看到的背景一模一样，两两之间的像素差异只可能来自滤镜。 */
  html, body { margin: 0; }
  body {
    padding: 20px;
    display: grid;
    gap: 12px;
    background: repeating-linear-gradient(90deg, #0b1f3a 0 1px, #eaf4ff 1px 72px);
    font: 12px/1.4 system-ui, sans-serif;
    color: #0d2b4e;
  }
  .row { display: grid; grid-template-columns: 250px 1fr; gap: 14px; align-items: center; }
  .glass { height: 84px; border-radius: 18px; position: relative; overflow: hidden; background: rgba(255,255,255,.35); border: 1px solid rgba(255,255,255,.6); }
  .warp { position: absolute; inset: 0; }
  .defs { position: absolute; width: 0; height: 0; overflow: hidden; }
</style>
</head>
<body>
  <div class="row"><span>1 只有模糊（对照）</span><div class="glass"><span class="warp" id="w1"></span></div></div>
  <div class="row"><span>2 内联 feTurbulence + backdrop url()</span><div class="glass"><span class="warp" id="w2"></span></div></div>
  <div class="row"><span>3 内联 feImage(数据图) + backdrop url()</span><div class="glass"><span class="warp" id="w3"></span></div></div>
  <div class="row"><span>4 动态创建 feImage + backdrop url()</span><div class="glass"><span class="warp" id="w4"></span></div></div>
  <div class="row"><span>5 内联 feImage + filter url()</span><div class="glass"><span class="warp" id="w5"></span></div></div>

  <svg class="defs" aria-hidden="true">
    <defs>
      <filter id="f-turb" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
        <feTurbulence type="fractalNoise" baseFrequency="0.02 0.03" numOctaves="2" seed="4" result="n" />
        <feDisplacementMap in="SourceGraphic" in2="n" scale="40" xChannelSelector="R" yChannelSelector="G" />
      </filter>
    </defs>
  </svg>

  <svg class="defs" aria-hidden="true">
    <defs>
      <filter id="f-image-inline" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
        <feImage href="" x="0" y="0" width="100%" height="100%" preserveAspectRatio="none" result="MAP" />
        <feDisplacementMap in="SourceGraphic" in2="MAP" scale="28" xChannelSelector="R" yChannelSelector="G" />
      </filter>
    </defs>
  </svg>

  <script>
    // 生成一张和线上实现同款的位移图：中心不动，边缘往中心拉
    function makeMap(w, h) {
      const c = document.createElement("canvas");
      c.width = 128; c.height = 128;
      const ctx = c.getContext("2d");
      const img = ctx.createImageData(128, 128);
      const d = img.data;
      const raw = new Float32Array(128 * 128 * 2);
      let max = 1;
      const sd = (px, py, hw, hh, r) => {
        const qx = Math.abs(px) - (hw - r), qy = Math.abs(py) - (hh - r);
        return Math.min(Math.max(qx, qy), 0) + Math.hypot(Math.max(qx, 0), Math.max(qy, 0)) - r;
      };
      const ss = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };
      for (let y = 0; y < 128; y++) for (let x = 0; x < 128; x++) {
        const px = ((x + 0.5) / 128 - 0.5) * w, py = ((y + 0.5) / 128 - 0.5) * h;
        const dist = sd(px, py, w / 2, h / 2, Math.min(w, h) * 0.3);
        const k = ss(0, Math.min(w, h) * 0.14, -dist);
        raw[(y * 128 + x) * 2] = px * k - px;
        raw[(y * 128 + x) * 2 + 1] = py * k - py;
        max = Math.max(max, Math.abs(px * k - px), Math.abs(py * k - py));
      }
      for (let i = 0; i < 128 * 128; i++) {
        d[i * 4] = Math.round((raw[i * 2] / max) * 127 + 128);
        d[i * 4 + 1] = Math.round((raw[i * 2 + 1] / max) * 127 + 128);
        d[i * 4 + 2] = 128; d[i * 4 + 3] = 255;
      }
      ctx.putImageData(img, 0, 0);
      return c.toDataURL();
    }

    const mapUrl = makeMap(520, 84);

    // 对照组 / feTurbulence
    document.getElementById("w1").style.backdropFilter = "blur(2px) saturate(180%)";
    document.getElementById("w2").style.backdropFilter = "blur(2px) url(#f-turb) saturate(180%)";

    // 内联 feImage
    document.querySelector("#f-image-inline feImage").setAttribute("href", mapUrl);
    document.getElementById("w3").style.backdropFilter = "blur(2px) url(#f-image-inline) saturate(180%)";
    document.getElementById("w5").style.filter = "url(#f-image-inline)";
    document.getElementById("w5").style.backdropFilter = "blur(2px) saturate(180%)";

    // 动态创建的滤镜（和线上代码同款做法）
    const defs = document.createElementNS("http://www.w3.org/2000/svg", "defs");
    document.body.appendChild(document.createElementNS("http://www.w3.org/2000/svg", "svg")).setAttribute("class", "defs");
    const hostSvg = document.querySelectorAll("svg.defs")[2];
    hostSvg.appendChild(defs);
    const f = document.createElementNS("http://www.w3.org/2000/svg", "filter");
    f.setAttribute("id", "f-image-dynamic");
    f.setAttribute("x", "-20%"); f.setAttribute("y", "-20%");
    f.setAttribute("width", "140%"); f.setAttribute("height", "140%");
    const im = document.createElementNS("http://www.w3.org/2000/svg", "feImage");
    im.setAttribute("href", mapUrl); im.setAttribute("x", "0"); im.setAttribute("y", "0");
    im.setAttribute("width", "100%"); im.setAttribute("height", "100%");
    im.setAttribute("preserveAspectRatio", "none"); im.setAttribute("result", "MAP");
    const dp = document.createElementNS("http://www.w3.org/2000/svg", "feDisplacementMap");
    dp.setAttribute("in", "SourceGraphic"); dp.setAttribute("in2", "MAP"); dp.setAttribute("scale", "28");
    dp.setAttribute("xChannelSelector", "R"); dp.setAttribute("yChannelSelector", "G");
    f.appendChild(im); f.appendChild(dp); defs.appendChild(f);
    document.getElementById("w4").style.backdropFilter = "blur(2px) url(#f-image-dynamic) saturate(180%)";
  </script>
</body>
</html>
