<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="zero to tech">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff00f7" />
      <stop offset="100%" stop-color="#1e98fd" />
    </linearGradient>
  </defs>
  <!-- 站点图标：渐变圆角方块 + 两条"文字行"，和页面主色一致。
       不用文字字形是为了不依赖系统字体（服务器/不同系统渲染结果不一致）。 -->
  <rect width="32" height="32" rx="8" fill="url(#g)" />
  <rect x="8" y="10.5" width="16" height="2.6" rx="1.3" fill="#ffffff" />
  <rect x="8" y="16" width="16" height="2.6" rx="1.3" fill="#ffffff" opacity="0.85" />
  <rect x="8" y="21.5" width="9" height="2.6" rx="1.3" fill="#ffffff" opacity="0.7" />
</svg>
